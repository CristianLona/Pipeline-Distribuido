[workspace]
resolver = "2"

members = [
    "sensor",
    "edge",
    "coordinador"
, "common"]

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rustls = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
