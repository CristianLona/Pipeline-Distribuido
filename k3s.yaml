---
# ==========================================
# 1. COORDINADOR (Solo en el Master)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinador-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinador
  template:
    metadata:
      labels:
        app: coordinador
    spec:
      nodeSelector:
        rol: master # Solo en el nodo maestro
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: coordinador
        image: app-coordinador:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: RUST_LOG
          value: "info"
        - name: BIND_ADDR
          value: "0.0.0.0:3001"
        - name: TLS_CERT
          value: "/certs/tls.crt"
        - name: TLS_KEY
          value: "/certs/tls.key"
        - name: TLS_CA
          value: "/certs/ca.crt"
        volumeMounts:
        - name: tls-certs
          mountPath: /certs
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: coord-tls
---
apiVersion: v1
kind: Service
metadata:
  name: coordinador-service
spec:
  selector:
    app: coordinador
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001

