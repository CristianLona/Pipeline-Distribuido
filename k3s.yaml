---
apiVersion: v1
kind: Service
metadata:
  name: edge-service
spec:
  internalTrafficPolicy: Local # CRUCIAL: El sensor habla con el edge de SU PROPIO nodo
  selector:
    app: edge
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000

---
# ==========================================
# 3. SENSORES (DaemonSets - S1 y S2 en cada nodo)
# ==========================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sensor-1-daemonset
spec:
  selector:
    matchLabels:
      app: sensor-1
  template:
    metadata:
      labels:
        app: sensor-1
    spec:
      nodeSelector:
        vincular-edge: "si"
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: sensor
        image: app-sensor:v1
        imagePullPolicy: Never
        env:
        - name: RUST_LOG
          value: "info"
        - name: SENSOR_ID
          value: "S1"
        - name: EDGE_URL
          value: "http://edge-service:3000/api/sensor"
